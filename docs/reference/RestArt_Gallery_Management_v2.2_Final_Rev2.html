/* v2.2 exhibition registration wizard */
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 20px}

.step .num{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#fff;font-size:10px;flex-shrink:0}
.step.active{color:var(--green);border-color:var(--green);font-weight:700}.step.active .num,.step.done .num{background:var(--green);color:#fff;border-color:var(--green)}
.wizard-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.8fr);gap:15px}

.theme-color-selected{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafbf9;margin-bottom:9px}.theme-color-large{width:42px;height:42px;border-radius:9px;border:1px solid rgba(0,0,0,.12);flex-shrink:0}.theme-color-large.empty{background:linear-gradient(135deg,#fff 0 48%,#e5e7e2 49% 51%,#fff 52%)}.theme-color-selected b{display:block;font-size:11px}.theme-color-selected small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.theme-color-search{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:10px;margin-bottom:9px}.theme-color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px;max-height:300px;overflow-y:auto;padding:2px}.theme-color-option{display:flex;align-items:center;gap:8px;min-width:0;padding:7px;border:1px solid var(--line);background:#fff;border-radius:8px;text-align:left;color:var(--ink)}.theme-color-option:hover{border-color:#9bb6a8;background:#fafcf9}.theme-color-option.selected{border:2px solid var(--green);padding:6px;background:var(--green-soft)}.theme-color-chip{width:25px;height:25px;border:1px solid rgba(0,0,0,.12);border-radius:6px;flex-shrink:0}.theme-color-label{min-width:0}.theme-color-label b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.theme-color-label small{display:block;font-size:8px;color:var(--muted)}.theme-color-empty{padding:16px;text-align:center;color:var(--muted);font-size:10px;border:1px dashed var(--line);border-radius:8px}

function openCustomer(id){let c=getCustomer(id);if(!c)return;let related=inquiries.filter(q=>q.customerId===id);let arts=c.works.map(getArtwork).filter(Boolean);let timeline=[...related.map(q=>({t:q.date,title:`${getArtwork(q.artworkId).name} 문의`,desc:q.source+' · '+q.status})),...interestEvents.filter(e=>e.customerId===id).map(e=>({t:e.time,title:`${getArtwork(e.artworkId).name} 관심 등록`,desc:e.source})),...(c.marketingConsent?[{t:c.first,title:'다음 전시 소식 수신 신청',desc:'마케팅 수신 동의 기록'}]:[])].sort((a,b)=>a.t.localeCompare(b.t,'ko')).reverse();

 <div class="drawer-section"><h3>동의 상태</h3><div class="toggle-row"><div>문의 답변을 위한 연락<small>응답 동의 여부</small></div>${c.replyConsent?'<span class="badge">동의</span>':'<span class="badge gray">미확인</span>'}</div><div class="toggle-row"><div>다음 전시 소식 수신<small>마케팅 목적 별도 동의</small></div>${c.marketingConsent?'<span class="badge">동의</span>':'<span class="badge gray">미동의</span>'}</div></div>
 <div class="drawer-section"><h3>최근 활동</h3><div class="timeline">${timeline.length?timeline.map(t=>`<div class="timeline-item"><i class="tl-dot"></i><div><b>${t.title}</b><p>${t.desc}</p><small>${t.t}</small></div></div>`).join(''):'<div class="tiny">표시할 활동이 없습니다.</div>'}</div></div>

 <div class="drawer-section"><h3>문의 처리</h3><div class="field"><label>진행 상태</label><select id="qStatus"><option ${q.status==='신규'?'selected':''}>신규</option><option ${q.status==='후속 예정'?'selected':''}>후속 예정</option><option ${q.status==='연락 완료'?'selected':''}>연락 완료</option><option ${q.status==='종료'?'selected':''}>종료</option></select></div><div class="field inline"><div><label>담당자</label><select id="qOwner"><option ${q.owner==='김민혁'?'selected':''}>김민혁</option><option ${q.owner==='이수진'?'selected':''}>이수진</option><option ${q.owner==='미배정'?'selected':''}>미배정</option></select></div><div><label>다음 연락일</label><input id="qDue" type="date" value="${q.due}"></div></div><div class="field"><label>처리 메모</label><textarea id="qNote" placeholder="문의 응대 내용과 다음 조치를 기록하세요."></textarea></div><button class="btn" onclick="saveInquiry('${id}')">문의 상태 및 후속 일정 저장</button></div>
 <div class="drawer-section"><h3>고객 관계 연결</h3><p class="tiny">이 고객이 남긴 관심 작품 ${c.works.length}점과 문의 ${c.inquiries.length}건을 고객 프로필에서 함께 확인할 수 있습니다.</p><button class="btn secondary small" onclick="openCustomer('${c.id}')">고객 프로필 열기</button></div>`)}
function saveInquiry(id){let q=getInquiry(id);if(!q)return;q.status=$('#qStatus').value;q.owner=$('#qOwner').value;q.due=$('#qDue').value;let n=$('#qNote').value.trim();if(n){q.message+='\n[갤러리 메모] '+n;}let c=getCustomer(q.customerId);if(c){c.owner=q.owner;c.next=q.due}toast('문의 상태와 후속 일정을 저장했습니다. (데모)');render();openInquiry(id)}
function openArtwork(id){let a=getArtwork(id);if(!a)return;let people=customers.filter(c=>c.works.includes(id));let qs=inquiries.filter(q=>q.artworkId===id);openDrawer(`<div class="drawer-head"><div><span class="badge">작품 관심 상세</span><h2 style="margin-top:7px">${a.name}</h2><p>${a.artist} · ${a.year}</p></div><button class="close" onclick="closeDrawer()">✕</button></div><img class="art-hero" src="${a.img}" alt="${a.name}"><p style="font-size:10px;color:#68736b">${a.desc}</p><div class="detail-grid"><div class="detail-box"><small>관심 등록</small><b>${a.interests}건</b></div><div class="detail-box"><small>관심 등록 방문 수*</small><b>${a.visitors}개</b></div><div class="detail-box"><small>문의</small><b>${a.inquiries}건</b></div><div class="detail-box"><small>대표 감성</small><b>${a.mood}</b></div></div><div class="drawer-section"><h3>관심을 남긴 방문자</h3><div class="timeline">${people.map(c=>`<div class="timeline-item"><i class="tl-dot"></i><div><b>${c.name}</b><p>${c.type==='anonymous'?'익명 방문 · 연락처 미확인':c.email}</p><small>${c.id} · 최근 ${c.last}</small><div style="margin-top:5px"><button class="btn ghost small" onclick="openCustomer('${c.id}')">고객 프로필</button></div></div></div>`).join('')}</div></div><div class="drawer-section"><h3>이 작품의 문의 내역</h3>${qs.length?qs.map(q=>`<div class="toggle-row"><div><b>${getCustomer(q.customerId).name}</b><small>${q.id} · ${q.date}</small></div><button class="btn ghost small" onclick="openInquiry('${q.id}')">문의 확인</button></div>`).join(''):'<div class="tiny">등록된 문의가 없습니다.</div>'}<div class="footer-note">* 관심 등록 방문 수는 해당 작품에 관심을 등록한 서로 다른 방문 세션 수입니다. 여러 작품에 관심을 남긴 한 방문은 작품별 집계에서 각각 계산될 수 있습니다.</div></div>`)}
function showNewCustomer(){showModal('고객 수동 등록',`<div class="field"><label>고객 이름 *</label><input id="newCName" autocomplete="name" placeholder="고객 이름을 입력하세요"></div><div class="field"><label>이메일</label><input id="newCEmail" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>전화번호</label><input id="newCPhone" type="tel" autocomplete="tel" placeholder="010-0000-0000"></div><div class="field"><label>갤러리 내부 메모</label><textarea id="newCMemo" placeholder="고객과의 첫 접점, 관심 작가·작품, 소개 경로 등 내부 참고사항을 기록하세요."></textarea></div><div style="height:4px"></div><label class="checkline"><input type="checkbox" id="newCReply"> 문의 답변을 위한 연락 목적을 확인했습니다.</label><div style="height:8px"></div><label class="checkline"><input type="checkbox" id="newCMarketing"> 다음 전시 소식 수신에 대한 별도 동의를 확인했습니다.</label><p class="footer-note">이메일 또는 전화번호 중 하나 이상을 입력해 주세요. 동의 항목은 실제 동의 근거가 확인된 경우에만 체크합니다. 내부 메모는 고객에게 노출되지 않습니다.</p><button class="btn" onclick="addCustomer()">고객 등록</button>`)}
function addCustomer(){const returnPage=current==='allCustomers'?'allCustomers':'customers';let name=$('#newCName').value.trim(),email=$('#newCEmail').value.trim(),phone=$('#newCPhone').value.trim(),memo=$('#newCMemo').value.trim();if(!name){toast('고객 이름을 입력해 주세요.');return}if(!email&&!phone){toast('이메일 또는 전화번호 중 하나를 입력해 주세요.');return}if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('이메일 형식을 확인해 주세요.');return}if(phone&&!/^[0-9+()\-\s]{8,20}$/.test(phone)){toast('전화번호 형식을 확인해 주세요.');return}let id='C-'+(1202+customers.filter(c=>c.id.startsWith('C-')).length);customers.unshift({id,name,type:'identified',galleryContact:true,email:email||'—',phone:phone||'—',replyConsent:$('#newCReply').checked,marketingConsent:$('#newCMarketing').checked,first:'미등록',last:'수동 등록',visits:0,works:[],inquiries:[],owner:'미배정',next:'',memo,acquisitionSource:'gallery',createdAt:'2026.11.24'});closeModal();customerType='전체';customerQuery='';allCustomerType='전체';allCustomerQuery='';go(returnPage);toast('고객을 추가했습니다. (데모)')}
function resetWizard(){wizardStep=1;themeColorQuery='';wizardData={title:'',gallery:'서림 아트스페이스',venue:'',startDate:'',endDate:'',intro:'',goals:[],recordTarget:'',interestTarget:'',inquiryTarget:'',themeColor:null,posterData:'',posterName:'',works:[],floorplanData:'',floorplanName:'',zones:[{id:'A',name:'A구역',wallLengthM:'',usableWidthM:''},{id:'B',name:'B구역',wallLengthM:'',usableWidthM:''},{id:'C',name:'C구역',wallLengthM:'',usableWidthM:''},{id:'D',name:'D구역',wallLengthM:'',usableWidthM:''}],autoClassified:false,qrUrl:'',qrGenerated:false};}
function showNewExhibition(){resetWizard();go('wizard');}
function renderWizard(){const labels=['기본 정보','작품 및 작가','배치도 및 구역','최종 검수'];return pageHead('새 전시 등록','전시 기본 정보부터 작품 목록, 구역 배치, 모바일 전시 페이지 QR까지 순서대로 등록합니다.')+
 `<div class="card"><div class="stepper">${labels.map((x,i)=>`<div class="step ${wizardStep===i+1?'active':wizardStep>i+1?'done':''}"><span class="num">${wizardStep>i+1?'✓':i+1}</span><span>${x}</span></div>`).join('')}</div><div id="wizardContent">${wizardBody()}</div><div class="wizard-actions"><button class="btn secondary" ${wizardStep===1?'disabled':''} onclick="wizardPrev()">이전 단계</button><div class="actions"><button class="btn secondary" onclick="go('exhibitions')">등록 취소</button><button class="btn" onclick="wizardNext()">${wizardStep===4?'전시 등록 완료':'다음 단계 →'}</button></div></div></div>`;}
function renderThemeColorOptions(){const q=(themeColorQuery||'').trim().toLowerCase();const list=restartThemeColors.filter(c=>!q||c.name.toLowerCase().includes(q)||c.hex.toLowerCase().includes(q)||`${c.r} ${c.g} ${c.b}`.includes(q));if(!list.length)return '<div class="theme-color-empty">검색된 색상이 없습니다.</div>';return list.map(c=>`<button type="button" class="theme-color-option ${wizardData.themeColor?.name===c.name?'selected':''}" title="${c.name} · RGB ${c.r}, ${c.g}, ${c.b} · ${c.hex}" aria-label="${c.name}, RGB ${c.r}, ${c.g}, ${c.b}" onclick="selectWizardThemeColor('${c.name}')"><span class="theme-color-chip" style="background:${c.hex}"></span><span class="theme-color-label"><b>${c.name}</b><small>${c.hex} · ${c.r}, ${c.g}, ${c.b}</small></span>${wizardData.themeColor?.name===c.name?'<span class="badge">선택</span>':''}</button>`).join('');}
function selectWizardThemeColor(name){const color=restartThemeColors.find(c=>c.name===name);if(!color)return;wizardData.themeColor={...color};const selected=$('#themeColorSelected');if(selected)selected.innerHTML=`<span class="theme-color-large" style="background:${color.hex}"></span><span><b>${esc(color.name)}</b><small>RGB ${color.r}, ${color.g}, ${color.b} · ${color.hex}</small></span>`;const grid=$('#themeColorGrid');if(grid)grid.innerHTML=renderThemeColorOptions();toast(`${color.name} 색상을 선택했습니다.`);}
function filterThemeColors(value){themeColorQuery=value||'';const grid=$('#themeColorGrid');if(grid)grid.innerHTML=renderThemeColorOptions();}

function wizardBody(){
 if(wizardStep===1){const goals=['신진 작가 소개','특정 작가 및 대표 작품 소개','전시 주제 및 메시지 전달','관람객 참여 확대','작품 문의 및 소장 관심 유도','기타'];return `<h3 style="font-size:14px;margin:0 0 13px">1단계 · 전시 기본 정보</h3><div class="wiz-form-grid"><div class="wiz-field"><label>전시명 *</label><input id="wizTitle" value="${esc(wizardData.title)}" placeholder="전시명을 입력하세요"></div><div class="wiz-field"><label>갤러리 *</label><input id="wizGallery" value="${esc(wizardData.gallery)}" placeholder="갤러리명"></div><div class="wiz-field"><label>전시 장소</label><input id="wizVenue" value="${esc(wizardData.venue)}" placeholder="주소 또는 전시 공간"></div><div class="wiz-field"><label>전시 시작일 *</label><input id="wizStart" type="date" value="${esc(wizardData.startDate)}"></div><div class="wiz-field"><label>전시 종료일 *</label><input id="wizEnd" type="date" value="${esc(wizardData.endDate)}"></div><div class="wiz-field full"><label>전시 소개</label><textarea id="wizIntro" placeholder="전시 주제와 소개를 작성하세요.">${esc(wizardData.intro)}</textarea></div><div class="wiz-field full"><label>전시 테마 색상 *</label><p class="tiny" style="margin:0 0 6px">RestArt 컬러 팔레트 65종 중 전시의 대표 색상을 선택하세요. 선택한 색상은 모바일 전시 페이지의 강조색과 테마 요소에 활용하는 기준입니다.</p><div class="theme-color-selected" id="themeColorSelected">${wizardData.themeColor?`<span class="theme-color-large" style="background:${wizardData.themeColor.hex}"></span><span><b>${esc(wizardData.themeColor.name)}</b><small>RGB ${wizardData.themeColor.r}, ${wizardData.themeColor.g}, ${wizardData.themeColor.b} · ${wizardData.themeColor.hex}</small></span>`:'<span class="theme-color-large empty"></span><span><b>테마 색상을 선택해 주세요.</b><small>색상 칩을 선택하면 이름과 RGB 값이 표시됩니다.</small></span>'}</div><input class="theme-color-search" id="themeColorSearch" type="search" placeholder="색상명 검색" value="${esc(themeColorQuery)}" oninput="filterThemeColors(this.value)"><div class="theme-color-grid" id="themeColorGrid">${renderThemeColorOptions()}</div><div class="footer-note">색상은 사용자가 선택한 RGB 값 그대로 저장합니다. 포스터 원본 이미지를 자동으로 변경하는 기능은 아닙니다.</div></div><div class="wiz-field full"><label>전시 목표 *</label><div class="wiz-checks">${goals.map(g=>`<label class="wiz-check"><input type="checkbox" data-wiz-goal="${esc(g)}" ${wizardData.goals.includes(g)?'checked':''}>${esc(g)}</label>`).join('')}</div></div></div><div class="wizard-panel" style="margin-top:12px"><h3>전시 성과 목표 (선택)</h3><p class="tiny">전시 개선 인사이트에서 목표 대비 실적을 비교할 때 사용합니다. 목표치를 설정하지 않아도 전시 등록은 가능합니다.</p><div class="wiz-form-grid"><div class="wiz-field"><label>작품 기록 목표 (건)</label><input id="wizRecordTarget" type="number" min="0" value="${esc(wizardData.recordTarget)}" placeholder="예: 150"></div><div class="wiz-field"><label>관심 등록 목표 (건)</label><input id="wizInterestTarget" type="number" min="0" value="${esc(wizardData.interestTarget)}" placeholder="예: 30"></div><div class="wiz-field"><label>작품 문의 목표 (건)</label><input id="wizInquiryTarget" type="number" min="0" value="${esc(wizardData.inquiryTarget)}" placeholder="예: 10"></div></div></div><div class="footer-note">* 필수 항목입니다. 종료일은 시작일보다 빠를 수 없습니다.</div>`;}
 if(wizardStep===2){return `<h3 style="font-size:14px;margin:0 0 13px">2단계 · 전시 포스터와 작품 목록</h3><div class="wizard-layout"><div class="wizard-panel"><h3>전시 포스터 업로드</h3><div class="wiz-upload">전시 대표 포스터 이미지를 업로드하세요.<input type="file" accept="image/*" onchange="handleWizardPoster(this.files[0])">${wizardData.posterName?`<div class="tiny">${esc(wizardData.posterName)}</div>`:''}${wizardData.posterData?`<img class="wiz-preview" src="${wizardData.posterData}" alt="전시 포스터 미리보기">`:''}</div></div><div class="wizard-panel"><h3>작품 목록 파일 업로드</h3><div class="wiz-upload">CSV 또는 Excel(.xlsx) 파일을 업로드하면 첫 번째 시트 또는 CSV 행을 작품 목록으로 변환합니다.<input type="file" accept=".csv,.xlsx" onchange="handleWizardArtworkFile(this.files[0])"><div class="footer-note">권장 열: 작품명, 작가명, 제작연도, 가로(cm), 세로(cm), 매체, 작품 설명</div><button class="btn secondary small" style="margin-top:10px" onclick="downloadArtworkTemplate()">작품 목록 양식 다운로드</button></div></div></div><div class="section-head" style="margin-top:17px"><h2>정리된 작품 목록</h2><span>${wizardData.works.length}점</span></div>${wizardData.works.length?`<div class="table-wrap"><table class="table wiz-work-table"><thead><tr><th>작품명</th><th>작가</th><th>제작연도</th><th>크기 (cm)</th><th>매체</th><th>작품 설명</th><th></th></tr></thead><tbody>${wizardData.works.map((w,i)=>`<tr><td><input value="${esc(w.name)}" placeholder="작품명" onchange="updateWizardWork(${i},'name',this.value)"></td><td><input value="${esc(w.artist)}" placeholder="작가" onchange="updateWizardWork(${i},'artist',this.value)"></td><td><input value="${esc(w.year)}" placeholder="연도" onchange="updateWizardWork(${i},'year',this.value)"></td><td><div style="display:flex;gap:4px"><input style="min-width:54px" value="${esc(w.width)}" placeholder="가로" onchange="updateWizardWork(${i},'width',this.value)"><input style="min-width:54px" value="${esc(w.height)}" placeholder="세로" onchange="updateWizardWork(${i},'height',this.value)"></div></td><td><input value="${esc(w.medium)}" placeholder="매체" onchange="updateWizardWork(${i},'medium',this.value)"></td><td><input value="${esc(w.description)}" placeholder="설명" onchange="updateWizardWork(${i},'description',this.value)"></td><td><button class="btn danger small" onclick="removeWizardWork(${i})">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="wiz-empty">작품 목록 파일을 업로드하거나 아래에서 작품을 직접 추가하세요.</div>'}<div class="wizard-panel section"><h3>작품 직접 추가</h3><div class="wiz-form-grid"><div class="wiz-field"><label>작품명 *</label><input id="manualWorkName" placeholder="작품명"></div><div class="wiz-field"><label>작가명 *</label><input id="manualWorkArtist" placeholder="작가명"></div><div class="wiz-field"><label>제작 연도</label><input id="manualWorkYear" placeholder="2026"></div><div class="wiz-field"><label>매체</label><input id="manualWorkMedium" placeholder="캔버스에 아크릴"></div><div class="wiz-field"><label>가로 (cm)</label><input id="manualWorkWidth" type="number" min="0" step="0.1"></div><div class="wiz-field"><label>세로 (cm)</label><input id="manualWorkHeight" type="number" min="0" step="0.1"></div><div class="wiz-field full"><label>작품 설명</label><textarea id="manualWorkDesc" placeholder="작품 설명 (선택)"></textarea></div></div><button class="btn secondary small" onclick="addWizardWork()">＋ 작품 목록에 추가</button></div><div class="footer-note">작품 목록에서 작품명, 작가, 연도, 크기, 매체 및 설명을 수정하거나 삭제할 수 있습니다. Excel 파일은 XLSX 라이브러리가 로드된 브라우저에서 처리됩니다. PDF 작품 목록의 자동 표 추출은 이번 프로토타입 범위에서 제외했습니다.</div>`;}

tton><div id="wizardQr" class="wiz-qr" style="margin-top:10px"><span class="tiny">실제 전시 페이지 URL을 입력한 뒤 QR 미리보기를 생성하세요.</span></div><div class="footer-note">QR은 입력한 주소를 인코딩합니다. 프로토타입은 실제 모바일 전시 페이지를 자동 생성하거나 서비스에 배포하지 않습니다. 운영 환경에서는 전시 등록 API가 발급한 고유 URL을 연결해야 합니다.</div></div></div><div class="footer-note">등록이 완료되면 전시 관리 목록에 추가되고, 상단 전시 선택 및 리포트 메뉴에서 새 전시를 선택할 수 있습니다.</div>`;

function wizardCaptureStep(){if(wizardStep===1){wizardData.title=$('#wizTitle')?.value.trim()||'';wizardData.gallery=$('#wizGallery')?.value.trim()||'';wizardData.venue=$('#wizVenue')?.value.trim()||'';wizardData.startDate=$('#wizStart')?.value||'';wizardData.endDate=$('#wizEnd')?.value||'';wizardData.intro=$('#wizIntro')?.value||'';wizardData.goals=$$('[data-wiz-goal]:checked').map(x=>x.dataset.wizGoal);wizardData.recordTarget=$('#wizRecordTarget')?.value||'';wizardData.interestTarget=$('#wizInterestTarget')?.value||'';wizardData.inquiryTarget=$('#wizInquiryTarget')?.value||'';}}
function wizardPrev(){wizardCaptureStep();if(wizardStep>1){wizardStep--;render();}}
function wizardNext(){wizardCaptureStep();if(wizardStep===1){if(!wizardData.title||!wizardData.gallery||!wizardData.startDate||!wizardData.endDate){toast('전시명, 갤러리, 시작일, 종료일을 입력해 주세요.');return}if(wizardData.endDate<wizardData.startDate){toast('종료일은 시작일보다 빠를 수 없습니다.');return}if(!wizardData.goals.length){toast('전시 목표를 최소 1개 선택해 주세요.');return}if(!wizardData.themeColor){toast('전시 테마 색상을 선택해 주세요.');return}}
 if(wizardStep===2){if(!wizardData.posterData){toast('전시 포스터 이미지를 업로드해 주세요.');return}if(!wizardData.works.length){toast('작품 목록을 업로드하거나 작품을 1점 이상 추가해 주세요.');return}const invalid=wizardData.works.find(w=>!w.name||!w.artist);if(invalid){toast('모든 작품의 작품명과 작가명을 입력해 주세요.');return}}
 if(wizardStep===3){if(!wizardData.floorplanData){toast('전시 배치도 이미지를 업로드해 주세요.');return}if(!wizardData.zones.length){toast('구역을 1개 이상 설정해 주세요.');return}const unassigned=wizardData.works.filter(w=>!w.zoneId||!wizardData.zones.some(z=>z.id===w.zoneId));if(unassigned.length){toast('모든 작품의 구역을 배정해 주세요.');return}}
 if(wizardStep<4){wizardStep++;render();return}completeWizardRegistration();}
function fileToDataURL(file,callback){if(!file)return;const reader=new FileReader();reader.onload=()=>callback(String(reader.result||''));reader.onerror=()=>toast('파일을 읽지 못했습니다.');reader.readAsDataURL(file);}
function handleWizardPoster(file){if(!file)return;if(!file.type.startsWith('image/')){toast('이미지 파일을 선택해 주세요.');return}fileToDataURL(file,data=>{wizardData.posterData=data;wizardData.posterName=file.name;render();});}
function handleWizardFloorplan(file){if(!file)return;if(!file.type.startsWith('image/')){toast('이미지 파일을 선택해 주세요.');return}fileToDataURL(file,data=>{wizardData.floorplanData=data;wizardData.floorplanName=file.name;render();});}
function parseCSVRows(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;}else if(ch==='"'){quoted=!quoted;}else if(ch===','&&!quoted){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row);row=[];cell='';}else cell+=ch;}row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row);return rows;}
function normaliseWorkRows(rows){if(!rows||rows.length<2)return [];const headers=rows[0].map(x=>String(x||'').replace(/^\uFEFF/,'').trim().toLowerCase());const aliases={name:['작품명','작품 이름','title','artwork','artwork name','name'],artist:['작가명','작가','artist','artist name'],year:['제작연도','제작 연도','연도','year'],width:['가로','가로(cm)','width','width(cm)'],height:['세로','세로(cm)','height','height(cm)'],medium:['매체','재료','medium','material'],description:['작품 설명','설명','description','desc'],image:['이미지 url','이미지url','image','image url']};const col={};Object.entries(aliases).forEach(([k,opts])=>col[k]=headers.findIndex(h=>opts.includes(h)));return rows.slice(1).map((r,i)=>{const val=k=>col[k]>=0?String(r[col[k]]||'').trim():'';let width=val('width'),height=val('height');return {tempId:'W-'+(i+1),name:val('name'),artist:val('artist'),year:val('year'),width,height,medium:val('medium'),description:val('description'),image:val('image'),zoneId:''};}).filter(w=>w.name||w.artist);}
async function handleWizardArtworkFile(file){if(!file)return;try{let rows=[];if(file.name.toLowerCase().endsWith('.csv')){const text=await file.text();rows=parseCSVRows(text);}else if(file.name.toLowerCase().endsWith('.xlsx')){if(!window.XLSX){toast('Excel 변환 라이브러리를 불러오지 못했습니다. CSV로 저장해 업로드해 주세요.');return}const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});}else{toast('CSV 또는 XLSX 파일만 지원합니다.');return}const parsed=normaliseWorkRows(rows);if(!parsed.length){toast('작품명과 작가명이 포함된 표를 확인해 주세요.');return}wizardData.works=parsed;render();toast(`${parsed.length}점의 작품 목록을 불러왔습니다. 내용을 검수해 주세요.`);}catch(e){console.error(e);toast('작품 파일을 읽지 못했습니다. 열 이름과 파일 형식을 확인해 주세요.')}}
function updateWizardWork(i,key,value){if(wizardData.works[i])wizardData.works[i][key]=value;}
function removeWizardWork(i){wizardData.works.splice(i,1);render();}
function addWizardWork(){const name=$('#manualWorkName')?.value.trim()||'',artist=$('#manualWorkArtist')?.value.trim()||'';if(!name||!artist){toast('작품명과 작가명을 입력해 주세요.');return}wizardData.works.push({tempId:'WM-'+Date.now(),name,artist,year:$('#manualWorkYear').value.trim(),width:$('#manualWorkWidth').value,height:$('#manualWorkHeight').value,medium:$('#manualWorkMedium').value.trim(),description:$('#manualWorkDesc').value.trim(),image:'',zoneId:''});render();toast('작품을 추가했습니다.');}
function downloadArtworkTemplate(){const csv='\ufeff작품명,작가명,제작연도,가로(cm),세로(cm),매체,작품 설명,이미지 URL\r\n잔상의 정원,김서윤,2024,91,117,캔버스에 아크릴,작품 설명,,\r\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='RestArt_작품목록_양식.csv';a.click();URL.revokeObjectURL(url);}
function addWizardZone(){const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const id=letters.split('').find(x=>!wizardData.zones.some(z=>z.id===x))||('Z'+(wizardData.zones.length+1));wizardData.zones.push({id,name:id+'구역',wallLengthM:'',usableWidthM:''});render();}
function updateWizardZone(i,key,value){if(wizardData.zones[i])wizardData.zones[i][key]=value;}
function autoClassifyWizardZones(){if(!wizardData.works.length){toast('먼저 작품 목록을 등록해 주세요.');return}if(!wizardData.floorplanData){toast('배치도 이미지를 먼저 업로드해 주세요.');return}wizardData.works.forEach((w,i)=>w.zoneId=wizardData.zones[i%wizardData.zones.length]?.id||'');wizardData.autoClassified=true;render();toast('구역 자동 분류 제안을 생성했습니다. 반드시 작품별 배정을 검수해 주세요.');}
function generateWizardQr(){wizardData.qrUrl=$('#wizQrUrl')?.value.trim()||'';const holder=$('#wizardQr');if(!holder)return;if(!/^https?:\/\//i.test(wizardData.qrUrl)){holder.innerHTML='<span class="tiny">http:// 또는 https:// 주소를 입력해 주세요.</span>';toast('올바른 전시 페이지 URL을 입력해 주세요.');return}holder.innerHTML='';if(window.QRCode){new QRCode(holder,{text:wizardData.qrUrl,width:168,height:168,colorDark:'#202923',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});wizardData.qrGenerated=true;}else{holder.innerHTML='<span class="tiny">QR 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</span>';toast('QR 라이브러리를 불러오지 못했습니다.');}}
function dateLabel(iso){return iso?iso.replaceAll('-','.'):''}

 exhibitions.push({id,title:wizardData.title,date,status:'준비 중',artists:artists.length,works:newWorks.length,checkins:0,leaflets:0,poster,venue:wizardData.venue,gallery:wizardData.gallery,intro:wizardData.intro,goals:[...wizardData.goals],themeColor:wizardData.themeColor?{...wizardData.themeColor}:null,floorplanData:wizardData.floorplanData,floorplanName:wizardData.floorplanName,qrUrl:wizardData.qrUrl,qrIssued:!!wizardData.qrGenerated});
 artworks.push(...newWorks);artworkAnalytics[id]={};newWorks.forEach(w=>artworkAnalytics[id][w.id]={recordCount:0,interestCount:0,inquiryCount:0,avgDwellSec:0,dwellSamples:0,emotionCounts:{}});
 exhibitionArtworkZones[id]={};zoneAnalytics[id]=wizardData.zones.map(z=>{const mapped=newWorks.filter((w,i)=>wizardData.works[i].zoneId===z.id);const occupied=mapped.reduce((n,w)=>n+(Number(w.width)||0)/100,0);exhibitionArtworkZones[id] ||= {};mapped.forEach(w=>exhibitionArtworkZones[id][w.id]=z.id);const wall=Number(z.wallLengthM)||0,usable=Number(z.usableWidthM)||wall;return {id:z.id,name:z.name,works:mapped.length,visitors:0,shots:0,avgDwellSec:0,dwellSamples:0,totalDwellSec:0,mood:'집계 전',wallLengthM:wall||null,usableWidthM:usable||null,occupiedWidthM:occupied,layoutOccupancyPct:usable?Math.round(occupied/usable*100):null};});
 zoneLayoutDemo[id]={};zoneAnalytics[id].forEach(z=>zoneLayoutDemo[id][z.id]={wallLengthM:z.wallLengthM||0,usableWidthM:z.usableWidthM||z.wallLengthM||0,occupiedWidthM:z.occupiedWidthM||0});
 exhibitionAnalytics[id]={qrOpens:0,checkins:0,recordStarts:0,leaflets:0,photoRecords:0,interestAdds:0,inquiries:0,dailyLabels:[],daily:[],hourLabels:['10–12시','12–14시','14–16시','16–18시','18–20시'],hourly:[0,0,0,0,0],styles:{collector:0,explorer:0,immerser:0,walker:0}};
 const objective=wizardData.goals.includes('작품 문의 및 소장 관심 유도')?'작품 소장 및 문의 유도':wizardData.goals.includes('관람객 참여 확대')?'관람 경험 및 참여 확대':wizardData.goals.includes('신진 작가 소개')||wizardData.goals.includes('특정 작가 및 대표 작품 소개')?'작가 및 작품 홍보':'복합 목표';exhibitionGoals[id]={objective,recordTarget:Number(wizardData.recordTarget)||0,interestTarget:Number(wizardData.interestTarget)||0,inquiryTarget:Number(wizardData.inquiryTarget)||0};
 selectedEx=id;const sel=$('#globalEx');if(sel){sel.add(new Option(wizardData.title,String(id)));sel.value=String(id);}go('exhibitions');toast(wizardData.qrGenerated?'전시가 등록되었고 QR 미리보기 주소가 저장되었습니다.':'전시가 등록되었습니다. 실제 전시 페이지 URL 및 QR은 서비스에서 연결해야 합니다.');resetWizard();
}
function downloadCSV(type){let rows=[];if(type==='customers'){rows=[['customer_id','display_name','type','email','phone','internal_memo','reply_consent','marketing_consent','interest_artworks','inquiry_count','owner','last_activity'],...customers.map(c=>[c.id,c.name,c.type,c.email,c.phone,c.memo||'',c.replyConsent,c.marketingConsent,c.works.map(id=>getArtwork(id).name).join('|'),c.inquiries.length,c.owner,c.last])]}else if(type==='inquiries'){rows=[['inquiry_id','customer_id','artwork','source','message','status','owner','follow_up_date','reply_consent'],...inquiries.map(q=>[q.id,q.customerId,getArtwork(q.artworkId).name,q.source,q.message,q.status,q.owner,q.due,q.replyConsent])]}else{rows=[['customer_id','display_name','artwork','source','time'],...interestEvents.map(e=>[e.customerId,getCustomer(e.customerId).name,getArtwork(e.artworkId).name,e.source,e.time])]};let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`restart-${type}-demo.csv`;a.click();URL.revokeObjectURL(url);toast('CSV 파일을 다운로드했습니다.')}


function selectedExhibition(){return exhibitions.find(e=>e.id===selectedEx)||exhibitions[0]}
function selectedAnalytics(){return exhibitionAnalytics[selectedEx]||{qrOpens:0,checkins:0,recordStarts:0,leaflets:0,photoRecords:0,interestAdds:0,inquiries:0,dailyLabels:[],daily:[],hourLabels:[],hourly:[],styles:{collector:0,explorer:0,immerser:0,walker:0}}}
function workMetrics(id){return (artworkAnalytics[selectedEx]||{})[id]||{recordCount:0,interestCount:0,inquiryCount:0,avgDwellSec:0,dwellSamples:0,emotionCounts:{}}}
function visitsForEx(id=selectedEx){return exhibitionVisits.filter(v=>v.exhibitionId===id)}
function customerIdsForEx(id=selectedEx){return [...new Set(visitsForEx(id).map(v=>v.customerId))]}
function customersForEx(id=selectedEx){let ids=new Set(customerIdsForEx(id));return customers.filter(c=>ids.has(c.id))}
function customerListForEx(id=selectedEx){const linked=customersForEx(id).filter(c=>c.type==='identified');const manual=customers.filter(c=>c.type==='identified'&&c.galleryContact);return [...new Map([...linked,...manual].map(c=>[c.id,c])).values()]}
function inquiriesForEx(id=selectedEx){return inquiries.filter(q=>(q.exhibitionId||1)===id)}
function countFmt(n){return (Number(n)||0).toLocaleString('ko-KR')}
function fmtDuration(sec){if(!sec)return '—';let m=Math.floor(sec/60),s=Math.round(sec%60);return m>0?`${m}분 ${String(s).padStart(2,'0')}초`:`${s}초`}
function fmtMinutes(sec){return sec?`${(sec/60).toFixed(1)}분`:'—'}
function lineSvg(values,labels){
 if(!values||!values.length)return `<div class="empty">아직 수집된 방문 데이터가 없습니다.</div>`;
 const w=640,h=205,l=28,r=12,t=16,b=35,iw=w-l-r,ih=h-t-b,max=Math.max(1,...values)*1.18;
 const pts=values.map((v,i)=>[l+(values.length===1?iw/2:i*iw/(values.length-1)),t+ih-(v/max)*ih]);
 const poly=pts.map(p=>p.join(',')).join(' '),area=`${l},${t+ih} ${poly} ${l+iw},${t+ih}`;
 const idx=[0,Math.round((values.length-1)*.25),Math.round((values.length-1)*.5),Math.round((values.length-1)*.75),values.length-1].filter((v,i,a)=>a.indexOf(v)===i);
 return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="날짜별 QR 체크인 추이"><g class="chart-grid"><path d="M${l} ${t+ih*.25}H${w-r}M${l} ${t+ih*.5}H${w-r}M${l} ${t+ih*.75}H${w-r}M${l} ${t+ih}H${w-r}"/></g><polygon class="chart-area" points="${area}"/><polyline class="chart-line" points="${poly}"/>${pts.map((p,i)=>`<circle class="chart-point" cx="${p[0]}" cy="${p[1]}" r="3.5"><title>${labels[i]} · ${values[i]}세션</title></circle>`).join('')}${idx.map(i=>`<text class="chart-axis" x="${pts[i][0]}" y="${h-9}" text-anchor="middle">${labels[i]}</text>`).join('')}</svg>`;
}
function hourlyChart(data,labels){let max=Math.max(1,...data);return `<div class="hour-bars">${data.map((v,i)=>`<div class="hour-bar"><span class="bar-value">${v}</span><div class="bar-track"><div class="bar-fill" style="height:${v/max*100}%"></div></div><small>${labels[i]}</small></div>`).join('')}</div>`}
function avgConversionForEx(){let vals=Object.keys(artworkAnalytics[selectedEx]||{}).map(workMetrics),den=vals.reduce((s,x)=>s+x.recordCount,0),num=vals.reduce((s,x)=>s+x.interestCount,0);return den?Math.round(num/den*100):0}

function recommendationsForEx(id=selectedEx){return visitsForEx(id).filter(v=>v.recommendedArtworkId).map(v=>({...v,art:getArtwork(v.recommendedArtworkId)})).filter(v=>v.art);}
function recommendationMetricsForEx(id=selectedEx){
 const recs=recommendationsForEx(id),ids=[...new Set(recs.map(v=>v.recommendedArtworkId))];
 const rankings=ids.map(artworkId=>{const list=recs.filter(v=>v.recommendedArtworkId===artworkId),interested=list.filter(v=>(v.interestWorks||[]).includes(artworkId));const inquiryCount=list.reduce((n,v)=>n+(v.inquiryIds||[]).map(getInquiry).filter(q=>q&&q.artworkId===artworkId).length,0);return {art:getArtwork(artworkId),recommendCount:list.length,interestCount:interested.length,interestRate:list.length?Math.round(interested.length/list.length*100):0,inquiryCount,list};}).sort((a,b)=>b.recommendCount-a.recommendCount||b.interestRate-a.interestRate);
 const interestCount=recs.filter(v=>(v.interestWorks||[]).includes(v.recommendedArtworkId)).length;
 const inquiryCount=recs.reduce((n,v)=>n+(v.inquiryIds||[]).map(getInquiry).filter(q=>q&&q.artworkId===v.recommendedArtworkId).length,0);
 return {recs,rankings,total:recs.length,interestCount,inquiryCount,interestRate:recs.length?Math.round(interestCount/recs.length*100):0};
}
function customerRecommendations(customerId,exOnly=false){return exhibitionVisits.filter(v=>v.customerId===customerId&&v.recommendedArtworkId&&(!exOnly||v.exhibitionId===selectedEx)).sort((a,b)=>String(b.visitAt).localeCompare(String(a.visitAt)));}
function recommendedNamesForCustomer(customerId){const names=[...new Set(customerRecommendations(customerId,true).map(v=>getArtwork(v.recommendedArtworkId)?.name).filter(Boolean))];return names.length?names.slice(0,2).join(' · ')+(names.length>2?` 외 ${names.length-2}점`:''):'—';}
function zoneTransitionsForEx(id=selectedEx){const counts={};visitsForEx(id).forEach(v=>{const seq=(v.recordSequence||[]).map(x=>x.zoneId).filter(Boolean);for(let i=0;i<seq.length-1;i++){if(seq[i]===seq[i+1])continue;const key=seq[i]+' → '+seq[i+1];counts[key]=(counts[key]||0)+1;}});const total=Object.values(counts).reduce((a,b)=>a+b,0);return Object.entries(counts).map(([route,count])=>({route,count,share:total?Math.round(count/total*100):0})).sort((a,b)=>b.count-a.count);}
const exhibitionGoals={1:{objective:'작품 소장 및 문의 유도',recordTarget:180,interestTarget:40,inquiryTarget:8},2:{objective:'관람 경험 및 참여 확대',recordTarget:420,interestTarget:35,inquiryTarget:12},3:{objective:'작가 및 작품 홍보',recordTarget:200,interestTarget:30,inquiryTarget:6}};
function showInsightTargets(){const g=exhibitionGoals[selectedEx]||{objective:'복합 목표',recordTarget:100,interestTarget:20,inquiryTarget:5};showModal('전시 목표 설정',`<div class="field"><label>전시의 주요 목적</label><select id="goalObjective">${['작가 및 작품 홍보','작품 소장 및 문의 유도','관람 경험 및 참여 확대','복합 목표'].map(x=>`<option ${g.objective===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>작품 기록 목표 (건)</label><input id="goalRecords" type="number" min="0" value="${g.recordTarget}"></div><div class="field"><label>관심 등록 목표 (건)</label><input id="goalInterests" type="number" min="0" value="${g.interestTarget}"></div><div class="field"><label>작품 문의 목표 (건)</label><input id="goalInquiries" type="number" min="0" value="${g.inquiryTarget}"></div><p class="footer-note">목표는 갤러리가 전시 시작 전에 설정하는 내부 운영 기준입니다. 업계 평균이나 자동으로 검증된 적정 수치를 의미하지 않습니다.</p><button class="btn" onclick="saveInsightTargets()">목표 저장</button>`);}
function saveInsightTargets(){const r=Math.max(0,Number($('#goalRecords').value)||0),i=Math.max(0,Number($('#goalInterests').value)||0),q=Math.max(0,Number($('#goalInquiries').value)||0);exhibitionGoals[selectedEx]={objective:$('#goalObjective').value,recordTarget:r,interestTarget:i,inquiryTarget:q};closeModal();render();toast('전시 목표를 저장했습니다. (데모)')}

function openCustomer(id){const c=getCustomer(id);if(!c)return;const allVisits=exhibitionVisits.filter(v=>v.customerId===id).sort((a,b)=>b.visitAt.localeCompare(a.visitAt)),related=inquiries.filter(q=>q.customerId===id).sort((a,b)=>String(b.date).localeCompare(String(a.date))),allWorks=[...new Set(allVisits.flatMap(v=>[...(v.recordedWorks||[]),...(v.interestWorks||[])]))].map(getArtwork).filter(Boolean),interestWorks=[...new Set(allVisits.flatMap(v=>v.interestWorks||[]))].map(getArtwork).filter(Boolean);openDrawer(`<div class="drawer-head"><div><span class="badge ${c.type==='anonymous'?'gray':''}">${c.type==='anonymous'?'익명 방문':'연락처 확인'}</span><h2 style="margin-top:7px">${esc(c.name)}</h2><p>${esc(c.id)} · 첫 방문 ${esc(c.first)}</p></div><button class="close" onclick="closeDrawer()">✕</button></div><div class="detail-grid"><div class="detail-box"><small>전시 방문</small><b>${allVisits.length}회</b></div><div class="detail-box"><small>기록 작품</small><b>${allWorks.length}점</b></div><div class="detail-box"><small>관심 작품</small><b>${interestWorks.length}점</b></div><div class="detail-box"><small>문의</small><b>${related.length}건</b></div></div><div class="drawer-section"><h3>연락 정보</h3>${c.type==='anonymous'?'<p class="tiny">연락처를 제공하지 않은 익명 리플릿 방문입니다. 이름·이메일·전화번호를 임의로 추정하지 않습니다.</p>':`<div class="detail-grid"><div class="detail-box"><small>이메일</small><b>${esc(c.email||'미등록')}</b></div><div class="detail-box"><small>전화번호</small><b>${esc(c.phone||'미등록')}</b></div></div>`}</div><div class="drawer-section"><h3>전시 방문 이력 · 전체 기간</h3>${allVisits.map(v=>{const e=exhibitions.find(x=>x.id===v.exhibitionId),recorded=(v.recordedWorks||[]).map(getArtwork).filter(Boolean),interested=(v.interestWorks||[]).map(getArtwork).filter(Boolean);return `<div class="timeline-item"><i class="tl-dot"></i><div><b>${esc(e?.title||'전시')}</b><p>${esc(v.visitAt)} · ${esc(v.leafletId)}</p><small>기록: ${recorded.map(a=>esc(a.name)).join(', ')||'없음'} · 관심: ${interested.map(a=>esc(a.name)).join(', ')||'없음'}</small></div></div>`}).join('')||'<p class="tiny">연결된 방문 이력이 없습니다.</p>'}</div><div class="drawer-section"><h3>관심 작품 목록</h3>${interestWorks.map(a=>`<div class="toggle-row"><div><b>${esc(a.name)}</b><small>${esc(a.artist)}</small></div><button class="btn ghost small" onclick="openArtwork('${a.id}')">작품 보기</button></div>`).join('')||'<p class="tiny">관심 등록한 작품이 없습니다.</p>'}</div><div class="drawer-section"><h3>가장 닮은 작품 추천 이력</h3><div class="timeline">${customerRecommendations(id).map(v=>{const a=getArtwork(v.recommendedArtworkId),ex=exhibitions.find(e=>e.id===v.exhibitionId),liked=(v.interestWorks||[]).includes(v.recommendedArtworkId),inq=(v.inquiryIds||[]).map(getInquiry).filter(q=>q&&q.artworkId===v.recommendedArtworkId).length;return `<div class="timeline-item"><i class="tl-dot"></i><div><b>${esc(a?.name||'작품 정보 없음')}</b><p>${esc(ex?.title||'전시')} · ${esc(v.recommendationReason||'추천 근거 미등록')}</p><small>${esc(v.recommendedAt||v.visitAt)} · 추천 알고리즘 ${esc(v.recommendationAlgorithmVersion||'버전 미등록')}</small><div class="tiny" style="margin-top:3px">${liked?'추천 후 관심 등록':''}${liked&&inq?' · ':''}${inq?'추천 작품 문의 '+inq+'건':''}${!liked&&!inq?'추천 이후 추가 행동 미확인':''}</div><button class="btn ghost small" onclick="openArtwork('${v.recommendedArtworkId}')">추천 작품 보기</button></div></div>`}).join('')||'<div class="tiny">연결된 추천 이력이 없습니다.</div>'}</div><div class="footer-note">추천 이력은 리플릿마다 저장합니다. 한 고객이 다른 전시에서 다시 추천받으면 별도의 이력으로 누적합니다.</div></div><div class="drawer-section"><h3>동의 상태</h3><div class="toggle-row"><div>문의 답변을 위한 연락<small>문의 처리 목적의 동의</small></div>${c.replyConsent?'<span class="badge">동의</span>':'<span class="badge gray">미확인</span>'}</div><div class="toggle-row"><div>다음 전시 소식 수신<small>마케팅 목적의 별도 동의</small></div>${c.marketingConsent?'<span class="badge">동의</span>':'<span class="badge gray">미동의</span>'}</div></div><div class="drawer-section"><h3>문의 이력 · 전체 기간</h3>${related.map(q=>`<div class="toggle-row"><div><b>${esc(getArtwork(q.artworkId)?.name||'작품 문의')}</b><small>${esc(q.id)} · ${esc(q.date)} · ${esc(exhibitions.find(e=>e.id===q.exhibitionId)?.title||'전시')}</small></div><button class="btn ghost small" onclick="openInquiry('${q.id}')">문의 보기</button></div>`).join('')||'<p class="tiny">문의 이력이 없습니다.</p>'}</div><div class="drawer-section"><h3>갤러리 내부 메모</h3><textarea id="customerMemo" class="field" style="width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:10px">${esc(c.memo||'')}</textarea><button class="btn small" onclick="saveCustomerMemo('${id}')">메모 저장</button></div>`)}
function downloadCSV(type){let rows=[],exName=selectedExhibition().title;if(type==='customers'){let list=customerListForEx();rows=[['customer_id','display_name','registration_source','email','phone','inquiry_reply_consent','newsletter_consent','internal_memo','interest_artworks_in_selected_exhibition','recommended_similar_artworks_in_selected_exhibition','inquiry_count_in_selected_exhibition','owner','last_activity'],...list.map(c=>{let v=visitsForEx().filter(x=>x.customerId===c.id),works=[...new Set(v.flatMap(x=>x.interestWorks||[]))].map(id=>getArtwork(id)?.name).filter(Boolean);const recs=[...new Set(customerRecommendations(c.id,true).map(x=>getArtwork(x.recommendedArtworkId)?.name).filter(Boolean))];return [c.id,c.name,c.galleryContact?'manual_gallery_contact':'exhibition_visitor',c.email,c.phone,c.replyConsent,c.marketingConsent,c.memo,works.join('|'),recs.join('|'),inquiriesForEx().filter(q=>q.customerId===c.id).length,c.owner,v.map(x=>x.visitAt).sort().slice(-1)[0]||c.last]})]}else if(type==='inquiries'){rows=[['exhibition','inquiry_id','customer_id','artwork','source','message','status','owner','follow_up_date','inquiry_reply_consent'],...inquiriesForEx().map(q=>[exName,q.id,q.customerId,getArtwork(q.artworkId)?.name||'',q.source,q.message,q.status,q.owner,q.due,q.replyConsent])]}else if(type==='recommendations'){rows=[['exhibition','leaflet_id','customer_id','recommended_artwork_id','recommended_artwork','recommendation_reason','algorithm_version','interest_after_recommendation','inquiry_after_recommendation','recommended_at'],...recommendationsForEx().map(v=>{const art=getArtwork(v.recommendedArtworkId),inq=(v.inquiryIds||[]).map(getInquiry).filter(q=>q&&q.artworkId===v.recommendedArtworkId).length;return [selectedExhibition().title,v.leafletId,v.customerId,v.recommendedArtworkId,art?.name||'',v.recommendationReason||'',v.recommendationAlgorithmVersion||'',(v.interestWorks||[]).includes(v.recommendedArtworkId),inq,v.recommendedAt||v.visitAt]})]}else{rows=[['exhibition','artwork_id','artwork','card2_photo_record_count','interest_add_count','record_to_interest_rate','inquiry_count','average_dwell_estimate_seconds','dwell_sample_count'],...Object.keys(artworkAnalytics[selectedEx]||{}).map(id=>{let m=workMetrics(id),a=getArtwork(id);return [exName,id,a?.name||'',m.recordCount,m.interestCount,m.recordCount?Math.round(m.interestCount/m.recordCount*100)+'%':'',m.inquiryCount,m.avgDwellSec,m.dwellSamples]})]};let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`restart-${type}-ex${selectedEx}-demo.csv`;a.click();URL.revokeObjectURL(url);toast('선택한 전시의 CSV를 다운로드했습니다. (데모)')}
function render(){const f={home:renderHome,allCustomers:renderAllCustomers,customers:renderCustomers,inquiries:renderInquiries,interests:renderInterests,exhibitions:renderExhibitions,wizard:renderWizard,reports:renderReports,visitors:renderVisitors,anonymous:renderAnonymous,spaces:renderSpaces,emotions:renderEmotions,insights:renderInsights,connections:renderConnections,settings:renderSettings};$('#view').innerHTML=f[current]();$('#crumb').textContent=pages[current];let n=$('#navInquiryCount');if(n)n.textContent=inquiriesForEx().filter(q=>q.status==='신규').length;$$('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));let g=$('#globalEx');if(g)g.value=String(selectedEx)}
function changeExhibition(v){selectedEx=Number(v)||1;render();toast('선택한 전시 기준으로 고객 및 분석 데이터를 전환했습니다. (데모)')}
render();
